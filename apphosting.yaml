# Runtime env vars sourced from Secret Manager.
env:
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: SERVICE_ACCOUNT_KEY
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: OGEEMO_ASSISTANT_URL
    secret: OGEEMO_ASSISTANT_URL
    availability:
      - RUNTIME
